/* ---------- One-rep PRs: real maxes only. A set you logged with exactly 1 rep, or a max you added yourself. Nothing is estimated. ---------- */
function realMaxList() {
  const best = {};
  const rank = (mid, d) => (mid ? '0' : '1') + d;                          // on a tie: your own entry first, then the earlier date
  const take = (id, name, kind, w, d, mid) => {
    const b = best[id];
    if (!b || w > b.val || (w === b.val && rank(mid, d) < rank(b.mid, b.d))) best[id] = { id, name, kind, val: w, d, mid: mid || '' };
  };
  S.workouts.forEach(wk => {
    if (wk.type !== 'workout') return;
    (wk.items || []).forEach(i => {
      if (WEIGHTED.indexOf(i.kind) < 0) return;
      (i.sets || []).forEach(s => { if (s.r === 1 && s.w > 0) take(i.id, i.name, i.kind, s.w, wk.date, ''); });
    });
  });
  S.mprs.forEach(m => {
    const ex = getEx(m.ex);
    if (ex && WEIGHTED.indexOf(ex.kind) > -1 && m.w > 0 && (m.orm || m.r === 1)) take(ex.id, ex.name, ex.kind, m.w, m.d, m.id);

  return Object.values(best).sort((a, b) => b.val - a.val || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

function runStats() {
  const runs = S.runs, wk = sundayOf(todayStr());
  const thisWeek = runs.filter(r => r.date >= wk).reduce((a, r) => a + r.mi, 0);
  const longest = runs.reduce((m, r) => Math.max(m, r.mi), 0);
  const best = runs.filter(r => r.mi >= 0.5).reduce((m, r) => Math.min(m, r.sec / r.mi), Infinity);
  const weeks = lastWeeks(8), vals = weeks.map(w => +runs.filter(r => r.date >= w && r.date < addDays(w, 7)).reduce((a, r) => a + r.mi, 0).toFixed(1));
  return { thisWeek, longest, best, weeks, vals, total: runs.reduce((a, r) => a + r.mi, 0) };
}

/* =====================================================================
   UI — Share Workout: draws a summary PICTURE of a finished workout (no links, no hosted pages).
   It goes to the phone's share sheet (any app) or is saved to Downloads.
   ===================================================================== */
const SHARE_W = 1080;
const cssVar = (n, d) => (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim() || d;

/* The drawing helpers every share picture uses */
function shareKit(ctx, dry) {
  const W = SHARE_W, P = 64, F = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const c = { bg: cssVar('--bg', '#0d0a17'), s1: cssVar('--s1', '#16112a'), line: cssVar('--line', '#352b5e'), tx: cssVar('--tx', '#f5f2ff'), mu: cssVar('--mu', '#aaa2cc'),
    on: cssVar('--on-pu', '#ffffff'), pu: cssVar('--pu', '#7c3aed'), pu2: cssVar('--pu2', '#9566ff'), pu3: cssVar('--pu3', '#c4a8ff') };
  const font = (w, px) => w + ' ' + px + 'px ' + F;
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const wrap = (text, maxW, maxLines) => {                    // split into lines that fit; the last line gets "..." if cut
    const words = String(text).split(/\s+/).filter(Boolean), lines = [];
    let cur = '';
    words.forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) {
      lines.length = maxLines;
      let l = lines[maxLines - 1];
      while (l.length > 1 && ctx.measureText(l + '...').width > maxW) l = l.slice(0, -1);
      lines[maxLines - 1] = l.replace(/[,\s]+$/, '') + '...';
    }
    return lines;
  };
  const txt = (s, x, y, f, col, align) => { ctx.font = f; if (dry) return; ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); };
  const pill = (label, x, y, h, fillCol, textCol, px) => {      // rounded label; returns its width
    ctx.font = font('800', px);
    const w = ctx.measureText(label).width + h * .8;
    if (!dry) { rr(x, y, w, h, h / 2); ctx.fillStyle = fillCol; ctx.fill(); }
    txt(label, x + h * .4, y + h / 2 + px * .35, font('800', px), textCol);
    return w;
  };
  const card = (x, y, w, h, r) => { if (!dry) { rr(x, y, w, h, r); ctx.fillStyle = c.s1; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = c.line; ctx.stroke(); } };
  const backdrop = () => {                                      // background + soft accent glow + top stripe
    if (dry) return;
    ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, ctx.canvas.height);
    const g = ctx.createRadialGradient(W, 0, 40, W, 0, 760); g.addColorStop(0, c.pu); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = .28; ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); ctx.globalAlpha = 1;
    ctx.fillStyle = c.pu; ctx.fillRect(0, 0, W, 14);
  };
  const header = (right) => { txt('POCKET GYM', P, 96, font('800', 30), c.pu3); txt(right, W - P, 96, font('600', 30), c.mu, 'right'); return 96 + 40; };
  const footer = y => { txt('Tracked with Pocket Gym', W / 2, y + 20, font('700', 30), c.mu, 'center'); return y + 20 + 70; };
  return { W, P, c, font, rr, wrap, txt, pill, card, backdrop, header, footer, dry, ctx };
}

/* Draw (or just measure, when dry) the whole picture; returns the height it needs */
function paintShare(ctx, rec, dry) {
  const K = shareKit(ctx, dry), W = K.W, P = K.P, c = K.c, font = K.font, rr = K.rr, wrap = K.wrap, txt = K.txt;
  let y = 0;

  if (!dry) {                                                  // background + soft accent glow
    ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, ctx.canvas.height);
    const g = ctx.createRadialGradient(W, 0, 40, W, 0, 760); g.addColorStop(0, c.pu); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = .28; ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); ctx.globalAlpha = 1;
    ctx.fillStyle = c.pu; ctx.fillRect(0, 0, W, 14);
  }
  y = 96;
  ctx.font = font('800', 30);
  txt('POCKET GYM', P, y, font('800', 30), c.pu3);
  const dt = parseYMD(rec.date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  txt(dt, W - P, y, font('600', 30), c.mu, 'right');
  y += 40;

  ctx.font = font('800', 78);
  const title = wrap(rec.name || 'Workout', W - 2 * P, 2);
  title.forEach(l => { y += 86; txt(l, P, y, font('800', 78), c.tx); });
  y += 44;

  const prs = rec.items.filter(i => i.pr).length;              // stat tiles
  const tiles = [[fmtClock(rec.dur), 'time'], [String(rec.sets), 'sets'], [rec.vol ? rec.vol.toLocaleString() : '-', 'lbs lifted']], gap = 20, tw = (W - 2 * P - 2 * gap) / 3;
  tiles.forEach((t, i) => {
    const x = P + i * (tw + gap);
    if (!dry) { rr(x, y, tw, 170, 32); ctx.fillStyle = c.s1; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = c.line; ctx.stroke(); }
    txt(t[0], x + tw / 2, y + 100, font('800', 60), c.tx, 'center');
    txt(t[1], x + tw / 2, y + 140, font('600', 28), c.mu, 'center');
  });
  y += 170 + 30;

  if (prs) {                                                   // PR pill
    const label = prs + (prs === 1 ? ' NEW PERSONAL RECORD' : ' NEW PERSONAL RECORDS');
    ctx.font = font('800', 30);
    const pw = ctx.measureText(label).width + 56;
    if (!dry) { rr(P, y, pw, 70, 35); ctx.fillStyle = c.pu; ctx.fill(); }
    txt(label, P + 28, y + 47, font('800', 30), c.on);

    out.push({ k: 'ready', n: k, side: 0, dur: ST_READY });
    out.push({ k: 'hold', n: k, side: 0, dur: s.hold });

  stClose();

  stRun = { steps: routine.steps, segs, seg: 0, end: Date.now() + segs[0].dur * 1000, paused: false, left: 0, total: segs.reduce((a, g) => a + g.dur, 0), title: title || 'Stretching', tickKey: '', done: false };

  document.body.appendChild(el);

/* ---------- The muscle groups, for matching a workout and for the Stretch tab ---------- */
const STRETCH_GROUPS = ['chest', 'back', 'shoulders', 'biceps', 'triceps', 'quads', 'hams', 'glutes', 'calves', 'core', 'neck'];
const SG_NAME = { chest: 'Chest', back: 'Back', shoulders: 'Shoulders', biceps: 'Biceps', triceps: 'Triceps', quads: 'Quads', hams: 'Hamstrings', glutes: 'Glutes & hips', calves: 'Calves', core: 'Core', neck: 'Neck' };

/* Which stretch muscle groups a finished workout trained, most sets first */
function trainedGroups(rec) {
  const n = {};
  (rec.items || []).forEach(i => {
    const ex = getEx(i.id), g = ex && ex.grp;
    if (!g || g === 'cardio' || STRETCH_GROUPS.indexOf(g) < 0) return;
    n[g] = (n[g] || 0) + ((i.sets || []).length || 1);
  });
  return Object.keys(n).sort((a, b) => n[b] - n[a] || STRETCH_GROUPS.indexOf(a) - STRETCH_GROUPS.indexOf(b));
}

/* ---------- Routine builder ----------
   groups: muscle groups in priority order; totalSec: the time to fill. Returns {steps, hold, total, groups}.
   Each step is a stretch (done on both sides when it has sides): a short get-ready, the hold, and a side switch. */
const ST_READY = 5, ST_SWITCH = 3, ST_HOLD_MIN = 15, ST_HOLD_MAX = 45;
const stCost = (st, h) => ST_READY + h + (st.sides ? ST_SWITCH + h : 0);
function buildStretchRoutine(groups, totalSec) {
  const want = groups.filter(g => STRETCH_GROUPS.indexOf(g) > -1);
  if (!want.length) return { steps: [], hold: 0, total: 0, groups: [] };
  const all = Object.values(STRETCH), used = {}, order = [];
  const score = st => st.groups.reduce((a, g) => { const k = want.indexOf(g); return k < 0 ? a : a + (st.groups[0] === g ? 3 : 1) * (want.length - k + 1); }, 0);
  const take = st => { if (st && !used[st.id]) { used[st.id] = 1; order.push(st); } };
  const tight = totalSec < want.length * 50;                                                                                          // little time per muscle: prefer one-sided stretches so every muscle gets one
  want.forEach(g => take(all.filter(st => !used[st.id] && st.groups[0] === g).sort((a, b) => (tight ? (a.sides ? 1 : 0) - (b.sides ? 1 : 0) : 0) || score(b) - score(a) || (a.id < b.id ? -1 : 1))[0]));        // the first round: the main stretch of each muscle group
  for (let pass = 0; pass < 3; pass++) {                                                                                                // then more for those muscles, then for the muscles next to them
    const pool = all.filter(st => !used[st.id] && (pass < 2 ? st.groups.some(g => want.indexOf(g) > -1) : st.groups.some(g => want.some(w => (SG_NEAR[w] || []).indexOf(g) > -1))));
    pool.sort((a, b) => score(b) - score(a) || (a.id < b.id ? -1 : 1)).forEach(take);
  }
  const fit = h => { let t = 0, n = 0; for (; n < order.length; n++) { const c = stCost(order[n], h); if (t + c > totalSec * 1.04) break; t += c; } return { n, t }; };
  let h = 30, f = fit(h);
  if (f.n < Math.min(want.length, order.length)) {                                    // too short to reach every muscle at 30 s: shorten the holds
    for (h = 25; h >= ST_HOLD_MIN; h -= 5) { f = fit(h); if (f.n >= Math.min(want.length, order.length)) break; }
    if (h < ST_HOLD_MIN) { h = ST_HOLD_MIN; f = fit(h); }
  }
  let steps = order.slice(0, Math.max(1, f.n));
  let total = steps.reduce((a, st) => a + stCost(st, h), 0);
  const per = steps.reduce((a, st) => a + (st.sides ? 2 : 1), 0);                      // spare time goes into longer holds, up to 45 s
  for (let g = 0; g < 6 && h + 5 <= ST_HOLD_MAX && total + per * 5 <= totalSec * 1.04; g++) { h += 5; total += per * 5; }
  if (total < totalSec * .9) {                                                       // lots of time left over: two stretches with shorter holds beat one very long hold
    for (let h2 = 25; h2 >= 20; h2 -= 5) {
      const f2 = fit(h2);
      if (f2.n > steps.length && f2.t > total && f2.t <= totalSec * 1.04) { h = h2; steps = order.slice(0, f2.n); total = f2.t; break; }
    }
  }
  const flow = steps.map((st, k) => [STRETCH_POS[st.id] || 0, k, st]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
  return { steps: flow.map(st => ({ id: st.id, sides: st.sides, hold: h })), hold: h, total, groups: want };
}
const routineTotal = r => r.steps.reduce((a, s) => a + ST_READY + s.hold + (s.sides ? ST_SWITCH + s.hold : 0), 0);

/* ---------- The picture ---------- */
function sArrow(a) {
  const e = a.length === 4 ? [a[2], a[3], a[0], a[1]] : [a[4], a[5], a[2], a[3]];     // the tip, and the point it comes from
  const dx = e[0] - e[2], dy = e[1] - e[3], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = 9, hw = 5.5;
  const bx = e[0] - ux * hl, by = e[1] - uy * hl, f = n => (Math.round(n * 10) / 10);
  const path = a.length === 4 ? 'M' + a[0] + ' ' + a[1] + 'L' + f(bx) + ' ' + f(by) : 'M' + a[0] + ' ' + a[1] + 'Q' + a[2] + ' ' + a[3] + ' ' + f(bx) + ' ' + f(by);
  return '<path d="' + path + '" class="sar"/><polygon class="sah" points="' + e[0] + ',' + e[1] + ' ' + f(bx - uy * hw) + ',' + f(by + ux * hw) + ' ' + f(bx + uy * hw) + ',' + f(by - ux * hw) + '"/>';
}
function stretchFig(id) {
  const st = STRETCH[id];
  if (!st) return '';
  const p = st.pose;
  let g = p.ng ? '' : '<line x1="12" y1="140" x2="228" y2="140" class="sgr"/>';
  g += p.props || '';
  (p.glow || []).forEach(o => { g += '<circle cx="' + o[0] + '" cy="' + o[1] + '" r="' + o[2] + '" class="sgl"/>'; });
  p.parts.forEach(s => { const hi = s[0] === '*'; g += '<polyline points="' + (hi ? s.slice(1) : s) + '" class="' + (hi ? 'sh' : 'sf') + '"/>'; });
  g += '<circle cx="' + p.head[0] + '" cy="' + p.head[1] + '" r="' + (p.head[2] || 9) + '" class="sfh"/>';
  (p.arrows || []).forEach(a => { g += sArrow(a); });
  return '<svg class="stfig" viewBox="0 0 240 160" role="img" aria-label="' + esc(st.name) + ' pose" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

function initStorage() {
  const missing = load();
  ['split', 'equip', 'settings'].forEach(k => { if (missing.indexOf(k) > -1) save(k, true); });   // pin first-run defaults
  if (S.settings.mig !== 2) {                       // one-time, from an older version: the old build jumped to tomorrow after a workout; days now follow the calendar
    S.settings.mig = 2; S.split.focus = todayStr(); S.split.seen = todayStr();
    save('settings', true); save('split', true);
  }
  const cut = addDays(todayStr(), -30);
  Object.keys(S.plans).forEach(d => { if (d < cut) delete S.plans[d]; });                          // forget old plan edits
}

function afterReload() {
  if (!spUi.busy) { spUi.prev = null; spUi.err = ''; spUi.note = ''; spUi.mode = 'plan'; }       // nothing typed or generated before an erase / restore carries over
  if (!ckAi.busy) ckAi.err = '';
  initStorage();
  applyInc();
  applyTheme();
  ensureFocus();
  if (S.session) beginTicker(); else { endTicker(); leaveSession(); }
  renderNav();
  render();
  renderNet();
}

/* Re-check the date whenever the app comes back to the foreground (e.g. opened the next morning) */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.session) return;
  const f = S.split.focus;
  ensureFocus();
  if (S.split.focus !== f || tab === 'workout') render();
});

/* Optional offline support: works if a sw.js sits next to this file on a web server */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(() => caches.open('pocketgym-v1').then(c => c.add(location.href.split('#')[0]))).catch(() => {});   // keep a copy so the app can start with no connection
}

initStorage();
if (!S.profile.done) tab = 'settings';          // first run lands on the profile screen
afterReload();
