    + '<div class="ex-s">' + (last ? 'Last ' + fmtDate(t.lastDate) + ': ' + esc(last) : (t.fresh ? 'New for you - starter estimate, adjust to feel' : '')) + (hint ? ' · <b>' + hint + '</b>' : '') + '</div>'
    + (t.ai ? '<div class="ai-n"><span class="chip">AI</span><span>' + (esc(t.aiNote) || 'Target set by the AI coach') + '</span></div>' : '') + '</div>'
    + '<div class="col" style="gap:6px"><button class="ib" style="width:44px;height:44px" data-act="ex-up" data-i="' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="Move up">' + ic('up') + '</button>'
    + '<button class="ib" style="width:44px;height:44px" data-act="ex-down" data-i="' + i + '" ' + (i === n - 1 ? 'disabled' : '') + ' aria-label="Move down">' + ic('down') + '</button></div></div>'
    + '<div class="ex-acts">'
    + (ex.kind === 'cd' ? '' : '<div class="stepper"><button data-act="sets-dec" data-i="' + i + '" aria-label="Fewer sets">−</button><b>' + it.sets + ' sets</b><button data-act="sets-inc" data-i="' + i + '" aria-label="More sets">+</button></div>')
    + '<span class="sp"></span><button class="ib" data-act="ex-swap" data-i="' + i + '" aria-label="Swap exercise">' + ic('swap') + '</button>'
    + '<button class="ib bad" data-act="ex-del" data-i="' + i + '" aria-label="Remove exercise">' + ic('trash') + '</button></div></div>';
}

function doneCard(date, done) {
  if (done.type === 'rest') return '<div class="card"><h2>' + ic('check') + ' Rest day done</h2><p class="mu" style="margin-top:6px">Recovery counts. Tomorrow is a new day.</p></div>';
  return '<div class="card"><h2 style="color:var(--ok)">' + ic('check') + ' Workout done</h2><p class="mu" style="margin:6px 0 10px">' + fmtClock(done.dur) + ' · ' + done.sets + ' sets · ' + done.vol.toLocaleString() + ' lbs lifted</p>'
    + done.items.map(i => '<div class="hrow"><b>' + esc(i.name) + (i.pr ? ' <span class="chip pu">PR</span>' : '') + '</b><span class="mu">' + esc(fmtSets(i.kind, i.sets)) + '</span></div>').join('') + '</div>';
}
function skipCard(date) {
  let end = date; while (skipOn(addDays(end, 1))) end = addDays(end, 1);
  const k = skipOn(date);
  return '<div class="card"><h2>' + ic('skip') + ' Skipped</h2><p class="mu" style="margin:6px 0 12px">' + (end === date ? 'This day is skipped.' : 'Skipping through <b>' + fmtDate(end, { weekday: 'short', month: 'short', day: 'numeric' }) + '</b>.') + ' '
    + (k.shift ? 'The schedule is paused: you pick up where you left off.' : 'The calendar keeps moving.') + '</p>'
    + '<button class="btn pri blk" data-act="skip-undo" data-d="' + date + '">Undo skip</button></div>';
}
function readyCard(date) {
  const r = S.ready[date] || {};
  const row = (k, label, opts) => '<div class="rdrow"><span class="rdl">' + label + '</span>' + segHTML('rd-' + k, opts.map((o, i) => [i + 1, o]), r[k] || 0, 'sm') + '</div>';
  return '<div class="card" id="ready-card"><div class="row"><h3 class="sp">How are you feeling?</h3><span class="mu xs">optional</span></div>'
    + row('sleep', 'Sleep', ['Poor', 'OK', 'Great']) + row('sore', 'Soreness', ['None', 'Some', 'High']) + row('energy', 'Energy', ['Low', 'OK', 'High'])
    + '<p class="mu xs" style="margin-top:8px">The AI uses this when it optimizes today\'s workout.</p></div>';
}
['sleep', 'sore', 'energy'].forEach(k => {
  ACTS['rd-' + k] = el => {
    const d = S.split.focus; S.ready[d] = Object.assign({}, S.ready[d], { [k]: +el.dataset.v }); save('ready', true);
    $$('[data-act="rd-' + k + '"]').forEach(b => b.classList.toggle('on', b === el));
  };
});

function planSection(date, inf) {
  const doneRec = doneForSplit(date);
  if (doneRec) return doneCard(date, doneRec);
  if (inf.skipped) return skipCard(date);
  if (inf.key === 'rest') {
    return '<div class="card"><h2>Rest and Recovery</h2><p class="mu" style="margin:6px 0 10px">Muscles grow while you recover. Keep today easy:</p>'
      + '<div class="col" style="gap:8px">' + REST_TIPS.map(t => '<div class="row">' + ic('check') + '<span>' + t + '</span></div>').join('') + '</div>'
      + '<button class="btn ok big" style="margin-top:16px" data-act="rest-done">' + ic('check') + ' Complete Rest Day</button></div>';
  }
  const items = planFor(date), aiOn = !!(S.plans[date] && S.plans[date].ai);
  return (S.settings.show.ready ? readyCard(date) : '') + '<div class="page-h" style="margin-top:22px"><h2>' + (date === todayStr() ? 'Today\'s Workout' : 'Workout') + '</h2><button class="btn sm" data-act="ex-add">' + ic('plus') + ' Add</button></div>'
    + (planEdited(date) ? '<div class="row wrap"><span class="chip pu">' + (aiOn ? 'AI optimized' : 'Edited') + '</span><span class="sp"></span><button class="btn sm ghost" data-act="plan-reset">Reset to auto plan</button></div>' : '')
    + (items.length ? aiBoxHTML(date) : '')
    + (items.length ? items.map((it, i) => exCard(it, i, items.length)).join('')
      : '<div class="card empty">No exercises match your equipment yet.<br>Tick more gear in Settings > Equipment, or add your own.</div>')
    + (items.length ? '<div class="startbar"><button class="btn pri big" data-act="start">' + ic('play') + ' Start Workout</button></div>' : '');
}

function vWorkout() {
  ensureFocus();
  const f = S.split.focus, t = dayInfo(f), tdy = todayStr();
  const wk = S.workouts.filter(w => w.type === 'workout' && w.date >= sundayOf(tdy)).length, goal = S.settings.goal || 4;
  return '<div class="page-h"><div><div class="lbl">' + fmtDate(tdy, { weekday: 'long', month: 'long', day: 'numeric' }) + '</div><h1>Workout</h1></div>'
    + '<span class="chip pu">' + ic('flame') + ' ' + wk + ' / ' + goal + ' this week</span></div>'
    + (S.profile.goalText ? '<div class="notice">Your goal: <b>' + esc(S.profile.goalText) + '</b></div>' : '')
    + (S.profile.done ? '' : '<div class="notice warn">Finish your profile so Pocket Gym can set your calorie targets and starting weights. <button class="btn sm" style="margin-top:10px" data-act="tab" data-t="settings">Open settings</button></div>')
    + '<div class="banner" id="banner">' + bannerHTML(f) + '</div>'
    + splitCard(f === tdy ? "Today's Split" : fmtDate(f, { weekday: 'long' }) + "'s Split", t, true)
    + (S.settings.show.tomorrow ? splitCard("Tomorrow's Split", dayInfo(addDays(f, 1)), false) : '')
    + (f >= tdy && !doneForSplit(f) && !t.skipped ? '<div class="' + (aiOn() && t.key !== 'rest' ? 'grid2' : '') + '"><button class="btn ghost blk" data-act="skip-open">' + ic('skip') + ' Skip workout</button>'
      + (aiOn() && t.key !== 'rest' ? '<button class="btn ghost blk" data-act="hurt-open">' + ic('bolt') + ' Something hurts?</button>' : '') + '</div>' : '')
    + planSection(f, t);
}

/* ---------- Skip workout ---------- */
let skipUi = { n: 1, shift: true };
function skipSheet() {
  const from = doneForSplit(todayStr()) ? addDays(todayStr(), 1) : todayStr(), last = addDays(from, skipUi.n - 1);
  openSheet('<div class="lbl">Skip workout</div><h2>How many days?</h2>'
    + '<div class="stepper" style="justify-content:center;margin:12px 0"><button data-act="skip-n" data-v="-1" aria-label="Fewer days">−</button><b>' + skipUi.n + (skipUi.n === 1 ? ' day' : ' days') + '</b><button data-act="skip-n" data-v="1" aria-label="More days">+</button></div>'
    + '<p class="mu sm c" style="margin-bottom:14px">' + fmtDate(from, { weekday: 'short', month: 'short', day: 'numeric' }) + (skipUi.n > 1 ? ' to ' + fmtDate(last, { weekday: 'short', month: 'short', day: 'numeric' }) : '') + '</p>'
    + segHTML('skip-mode', [[1, 'Pause the schedule'], [0, 'Just skip']], skipUi.shift ? 1 : 0, 'stack')
    + '<p class="mu sm" style="margin:10px 0 14px">' + (skipUi.shift ? 'Later days shift back, so you pick up exactly where you left off.' : 'The calendar keeps moving. Skipped days are just missed.') + '</p>'
    + '<div class="grid2"><button class="btn ghost" data-act="sheet-close">Cancel</button><button class="btn pri" data-act="skip-go" data-d="' + from + '">Skip</button></div>');
}
ACTS['skip-open'] = () => { skipUi = { n: 1, shift: true }; skipSheet(); };
ACTS['skip-n'] = el => { skipUi.n = clamp(skipUi.n + +el.dataset.v, 1, 30); skipSheet(); };
ACTS['skip-mode'] = el => { skipUi.shift = el.dataset.v === '1'; skipSheet(); };
ACTS['skip-go'] = el => {
  if (!addSkips(el.dataset.d, skipUi.n, skipUi.shift)) return;
  S.split.focus = todayStr(); save('split'); closeSheet(); render(); scrollBanner(true);
  toast(skipUi.n + (skipUi.n === 1 ? ' day' : ' days') + ' skipped');
};
ACTS['skip-undo'] = el => { if (undoSkipRun(el.dataset.d)) { closeSheet(); render(); scrollBanner(true); toast('Skip undone'); } };

/* ---------- Banner tap: preview a day / jump to it ---------- */
ACTS.peek = el => {
  const d = el.dataset.d, inf = dayInfo(d), done = doneForSplit(d);
  let body;
  if (done && done.type === 'workout') {
    body = '<div class="lbl">Completed · ' + fmtClock(done.dur) + ' · ' + done.vol.toLocaleString() + ' lbs lifted</div>'
      + done.items.map(i => '<div class="hrow"><b>' + esc(i.name) + '</b><span class="mu">' + esc(fmtSets(i.kind, i.sets)) + '</span></div>').join('');
  } else if (inf.skipped) {
    body = '<div class="notice">Skipped' + (skipOn(d).shift ? ' (schedule paused)' : '') + '</div><button class="btn blk" data-act="skip-undo" data-d="' + d + '">Undo skip</button>';
  } else if (inf.key === 'rest') {
    body = REST_TIPS.map(t => '<div class="row">' + ic('check') + '<span>' + t + '</span></div>').join('');
  } else {
    body = planFor(d).map(it => { const ex = getEx(it.id), rg = rangeFor(ex);
      return '<div class="hrow"><b>' + esc(ex.name) + '</b><span class="mu">' + (ex.kind === 'cd' ? targetFor(ex, it).r + ' min' : it.sets + ' × ' + rg[0] + '–' + rg[1]) + '</span></div>'; }).join('')
      || '<div class="empty">No exercises match your equipment.</div>';
  }
  openSheet('<div class="lbl">Week ' + inf.week + ' · ' + inf.dow + ' · ' + fmtDate(d, { month: 'long', day: 'numeric' }) + '</div><h2>' + esc(inf.name) + '</h2>' + body
    + (d !== S.split.focus && !done ? '<button class="btn pri blk" data-act="set-focus" data-d="' + d + '">Make this my split for today</button>' : '')
    + '<button class="btn ghost blk" data-act="sheet-close">Close</button>');
};
ACTS['set-focus'] = el => { S.split.focus = el.dataset.d; save('split'); closeSheet(); render(); scrollBanner(true); };

/* ---------- Plan editing (only possible before the workout starts) ---------- */
const focusEdit = fn => { editPlan(S.split.focus, fn); render(); };
ACTS['ex-up'] = el => { const i = +el.dataset.i; if (i > 0) focusEdit(a => { const t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; }); };
ACTS['ex-down'] = el => { const i = +el.dataset.i; focusEdit(a => { if (i < a.length - 1) { const t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; } }); };
ACTS['ex-del'] = el => focusEdit(a => { a.splice(+el.dataset.i, 1); });
ACTS['sets-inc'] = el => focusEdit(a => { const x = a[+el.dataset.i]; x.sets = clamp(x.sets + 1, 1, 10); });
ACTS['sets-dec'] = el => focusEdit(a => { const x = a[+el.dataset.i]; x.sets = clamp(x.sets - 1, 1, 10); });
ACTS['plan-reset'] = () => ask('Reset plan?', 'This removes your edits' + (S.plans[S.split.focus] && S.plans[S.split.focus].ai ? ' and the AI plan' : '') + ' and rebuilds today\'s workout from your split and equipment.', 'Reset', () => { resetPlan(S.split.focus); render(); });
ACTS['rest-done'] = () => {
  if (completeRest(S.split.focus)) { toast('Rest day done'); render(); }
};
ACTS.start = () => {
  const d = S.split.focus;
  if (!planFor(d).length) { toast('Add at least one exercise first'); return; }
  aiAbort();                                  // an AI request still in flight is dropped - the workout starts exactly as planned
  if (!startSession(d)) { toast('Could not start the workout'); return; }
  render();
};

/* ---------- Exercise picker (add + swap) and custom exercises ---------- */
let pk = { mode: 'add', idx: -1, grp: 'all', q: '', ai: null };
function pickerBody() {
  const inPlan = planFor(S.split.focus).map(i => i.id), q = pk.q.trim().toLowerCase();
  const order = Object.keys(GRP);
  let list = availableEx().filter(ex => (pk.grp === 'all' || ex.grp === pk.grp) && (!q || ex.name.toLowerCase().indexOf(q) > -1) && inPlan.indexOf(ex.id) < 0)
    .sort((a, b) => order.indexOf(a.grp) - order.indexOf(b.grp) || a.name.localeCompare(b.name));
  if (pk.ai) list = pk.ai.map(getEx).filter(ex => ex && inPlan.indexOf(ex.id) < 0);       // AI matches, best first
  return list.length ? list.map(ex => '<button class="chk" data-act="pick-ex" data-id="' + ex.id + '"><span class="sp"><b>' + esc(ex.name) + '</b><br><span class="mu sm">' + GRP[ex.grp] + (ex.custom ? ' · custom' : '') + '</span></span>' + ic('plus') + '</button>').join('')
    : '<div class="empty">No matches. Tick more gear in Settings > Equipment or create a custom exercise.</div>';
}
function drawPicker() {
  const cur = pk.mode === 'swap' ? getEx(planFor(S.split.focus)[pk.idx].id) : null;
  openSheet('<h2>' + (cur ? 'Swap ' + esc(cur.name) : 'Add exercise') + '</h2>'
    + '<input class="in" id="pick-q" data-in="pick-q" placeholder="Search, or describe what you want" value="' + esc(pk.q) + '" autocomplete="off">'
    + (aiOn() ? '<button class="btn sm blk" id="pick-ai-btn" data-act="pick-ai">' + ic('spark') + ' Find with AI</button><div class="mu xs" id="pick-ai-note">' + (pk.ai ? 'Showing the AI\'s best matches. Edit the text to go back to normal search.' : 'Try: "chest exercise that is easy on the shoulders".') + '</div>' : '')
    + '<div class="seg g3 sm">' + [['all', 'All']].concat(Object.entries(GRP)).map(g => '<button data-act="pick-grp" data-v="' + g[0] + '" class="' + (pk.grp === g[0] ? 'on' : '') + '">' + g[1] + '</button>').join('') + '</div>'
    + '<div class="chks" id="pick-list">' + pickerBody() + '</div>'
    + '<button class="btn ghost blk" data-act="cx-new">' + ic('plus') + ' Create custom exercise</button>');
}
ACTS['ex-add'] = () => { pk = { mode: 'add', idx: -1, grp: 'all', q: '', ai: null }; drawPicker(); };
ACTS['ex-swap'] = el => { const i = +el.dataset.i; pk = { mode: 'swap', idx: i, grp: getEx(planFor(S.split.focus)[i].id).grp, q: '', ai: null }; drawPicker(); };
ACTS['pick-grp'] = el => { pk.grp = el.dataset.v; drawPicker(); };
INP['pick-q'] = el => { pk.q = el.value; pk.ai = null; const n = $('#pick-ai-note'); if (n) n.textContent = 'Try: "chest exercise that is easy on the shoulders".'; $('#pick-list').innerHTML = pickerBody(); };
ACTS['pick-ai'] = () => {
  const q = ($('#pick-q').value || '').trim();
  if (q.length < 3) { toast('Describe what you want first'); return; }
  if (!aiGate()) return;
  needConsent('search', 'The text you typed, plus the names of the exercises you can do with your equipment.', () => {
    if (!$('#pick-list')) drawPicker();                   // the consent sheet replaced the picker: bring it back (pk.q keeps your words)
    const b = $('#pick-ai-btn'), n = $('#pick-ai-note'); if (b) b.disabled = true; if (n) { n.style.color = ''; n.textContent = 'Searching...'; }
    aiSearch(q).then(r => {
      if (!$('#pick-list')) return;
      pk.ai = r.ids; pk.grp = 'all'; $('#pick-list').innerHTML = pickerBody();
      const nn = $('#pick-ai-note'); if (nn) nn.textContent = r.ids.length ? 'Showing the AI\'s best matches. Edit the text to go back to normal search.' : 'The AI found nothing that fits. Try different words.';
      if (r.fell && nn) nn.textContent += ' (' + (r.tier === 'quick' ? 'Strong' : 'Quick') + ' model was at its limit; the ' + r.tier + ' model answered.)';
    }).catch(e => { const nn = $('#pick-ai-note'); if (nn) { nn.style.color = 'var(--bad)'; nn.textContent = niceErr(e); } })
      .finally(() => { const bb = $('#pick-ai-btn'); if (bb) bb.disabled = false; });
  });
};
function putInPlan(id) {
  const ex = getEx(id);
  editPlan(S.split.focus, a => {
    if (pk.mode === 'swap') {
      const prev = a[pk.idx], pe = getEx(prev.id);
      a[pk.idx] = { id, sets: ex.kind === 'cd' ? 1 : (pe.kind === 'cd' ? ex.sets : prev.sets) };
    } else a.push({ id, sets: ex.kind === 'cd' ? 1 : ex.sets });
  });
  closeSheet(); render(); toast((pk.mode === 'swap' ? 'Swapped to ' : 'Added ') + ex.name);
}
ACTS['pick-ex'] = el => putInPlan(el.dataset.id);

ACTS['cx-new'] = () => {
  openSheet('<h2>Custom exercise</h2>'
    + field('Name', '<input class="in" id="cx-name" placeholder="e.g. Cable Pullover" autocomplete="off">')
    + field('Muscle group', '<select class="in" id="cx-grp">' + Object.entries(GRP).filter(g => g[0] !== 'cardio').map(g => '<option value="' + g[0] + '">' + g[1] + '</option>').join('') + '</select>')
    + field('Type', '<select class="in" id="cx-kind"><option value="bb">Barbell / plates (+5 lbs)</option><option value="db">Dumbbell (+2.5 lbs)</option><option value="mc">Machine / cable (+5 lbs)</option><option value="bw">Bodyweight (progress by reps)</option><option value="cd">Cardio (minutes)</option></select>')
    + '<div class="grid3">' + field('Sets', '<input class="in" id="cx-sets" type="number" inputmode="numeric" value="3">')
    + field('Reps from', '<input class="in" id="cx-lo" type="number" inputmode="numeric" value="8">')
    + field('Reps to', '<input class="in" id="cx-hi" type="number" inputmode="numeric" value="12">') + '</div>'
    + '<button class="btn pri big" data-act="cx-save">Save and add</button>');
};
ACTS['cx-save'] = () => {
  const name = $('#cx-name').value.trim(), kind = $('#cx-kind').value;
  if (!name) { toast('Give the exercise a name'); return; }
  const lo = clamp(Math.round(num($('#cx-lo').value, 8)), 1, 29), hi = clamp(Math.round(num($('#cx-hi').value, 12)), lo + 1, 30);
  const ex = { id: 'c_' + uid(), custom: true, name, grp: kind === 'cd' ? 'cardio' : $('#cx-grp').value, kind, eq: [],
    lo: kind === 'cd' ? 20 : lo, hi: kind === 'cd' ? 60 : hi, inc: S.settings.inc[kind] || { bb: 5, db: 2.5, mc: 5, bw: 0, cd: 0 }[kind],
    sets: kind === 'cd' ? 1 : clamp(Math.round(num($('#cx-sets').value, 3)), 1, 10), m: 0 };
  S.custom.push(ex);
  if (!save('custom')) { S.custom.pop(); return; }
  putInPlan(ex.id);
};

/* =====================================================================
   UI — live workout session (full-screen, locked until finished or discarded)
   ===================================================================== */
const repOpts = sel => { let h = ''; for (let n = 1; n <= 30; n++) h += '<option value="' + n + '"' + (n === sel ? ' selected' : '') + '>' + n + '</option>'; return h; };

function setHTML(it, i, s, j) {
  const cd = it.kind === 'cd', bw = it.kind === 'bw', k = 'data-i="' + i + '" data-j="' + j + '"';
  const grid = cd
    ? '<div class="set-g" style="grid-template-columns:1fr">' + field('Minutes', '<input class="in" type="number" inputmode="numeric" min="0" max="300" value="' + s.r + '" data-in="s-m" ' + k + '>') + '</div>'
    : '<div class="set-g">' + field(bw ? 'Added lbs' : 'Weight (lbs)', '<input class="in" type="number" inputmode="decimal" step="2.5" min="0" value="' + (s.w || '') + '" placeholder="' + (bw ? '0' : '') + '" data-in="s-w" ' + k + '>')
      + field('Reps', '<select class="in" data-ch="s-r" ' + k + '>' + repOpts(s.r) + '</select>')
      + field('Failure?', '<button class="failbtn ' + (s.f ? 'on' : '') + '" data-act="s-fail" ' + k + '>' + (s.f ? 'Failure' : 'Not failure') + '</button>') + '</div>';
  return '<div class="set ' + (s.d ? 'done' : '') + '" id="set-' + i + '-' + j + '"><div class="set-h"><span class="set-n">' + (j + 1) + '</span>'
    + '<div class="sp"><b>' + (cd ? 'Time' : 'Set ' + (j + 1)) + '</b></div>'
    + '<button class="chkbtn ' + (s.d ? 'on' : '') + '" data-act="s-check" ' + k + ' aria-label="Mark set complete">' + ic('check') + '</button></div>' + grid + '</div>';
}

function renderSession() {
  const ses = S.session, root = $('#session');
  $('#view').innerHTML = '';                 // lock-down: the plan and tabs underneath are removed and inert
  $('#app').inert = true;
  root.classList.remove('hide');
  root.innerHTML = '<div class="s-head"><div><div class="lbl">In progress</div><div class="s-timer" id="clock">' + fmtClock((Date.now() - ses.start) / 1000) + '</div></div>'
    + '<span class="sp"></span><button class="btn sm bad" data-act="s-discard">Discard</button><button class="btn sm ok" data-act="s-finish">Finish</button></div>'
    + '<div class="s-body"><div class="card flat"><div class="s-net"><div class="lbl sp">' + esc(dayInfo(ses.splitDate).dow) + ' · ' + esc(ses.name) + '</div>'
    + '<button type="button" class="net on" data-act="net-info" aria-label="Online"><i class="dot"></i><span class="nt">Online</span></button></div>'
    + '<div class="row" style="margin:8px 0"><b class="num" id="s-done"></b><span class="sp"></span><span class="mu sm">Plan is locked until you finish</span></div><div class="s-prog"><i id="s-bar"></i></div></div>'
    + ses.items.map((it, i) => '<div class="ex"><div class="ex-t">' + esc(it.name) + ': <span class="tg">' + esc(targetText({ kind: it.kind }, { w: it.tw, r: it.tr })) + '</span></div>'
      + (it.last ? '<div class="ex-s">Last time: ' + esc(it.last) + '</div>' : '<div class="ex-s">First time - go by feel</div>')
      + (it.kind === 'db' ? '<div class="ex-s">Weight is per dumbbell</div>' : '')
      + (it.ai ? '<div class="ai-n"><span class="chip">AI</span><span>' + (esc(it.note) || 'Target set by the AI coach') + '</span></div>' : '')
      + it.sets.map((s, j) => setHTML(it, i, s, j)).join('') + '</div>').join('')
    + '</div><div id="rest-bar" class="rest"></div>';
  refreshProgress();
  renderRest();
  renderNet();
}

function refreshProgress() {
  const total = S.session.items.reduce((n, it) => n + it.sets.length, 0), d = setsDone();
  const a = $('#s-done'), b = $('#s-bar');
  if (a) a.textContent = d + ' of ' + total + ' sets done';
  if (b) b.style.width = (total ? d / total * 100 : 0) + '%';
}

function renderRest() {
  const bar = $('#rest-bar');
  if (!bar || !S.session) return;

/* Re-render without losing what's typed in the Add-a-meal form */
function keepForm(fn) {
  const ids = ['f-ai-text', 'f-name', 'f-kcal', 'f-p', 'f-c', 'f-f', 'f-bc'], vals = ids.map(i => { const e = $('#' + i); return e ? e.value : null; });

}
function upsertSaved(m, flag) {
  let x = findSaved(m);
  if (!x) { x = { id: uid(), name: m.name, kcal: m.kcal, p: m.p || 0, c: m.c || 0, f: m.f || 0, grp: grpOf(m.slot), list: false, fav: false }; S.saved.push(x); }
  x[flag] = !x[flag];
  if (!x.list && !x.fav) S.saved = S.saved.filter(y => y !== x);
  return x;
}
const findMeal = id => (S.food[foodDate] || []).find(m => m.id === id);
function toggleFlag(el, flag) {
  const m = findMeal(el.dataset.id); if (!m) return;
  const before = JSON.stringify(S.saved);
  const x = upsertSaved(m, flag);
  if (!save('saved')) { S.saved = JSON.parse(before); return; }
  keepForm(render); toast(flag === 'fav' ? (x.fav ? 'Added to favorites' : 'Removed from favorites') : (x.list ? 'Saved to your list' : 'Removed from your list'));
}
ACTS['f-fav'] = el => toggleFlag(el, 'fav');
ACTS['f-save'] = el => toggleFlag(el, 'list');
ACTS['sv-del'] = el => {
  const x = S.saved.find(y => y.id === el.dataset.id); if (!x) return;
  const before = JSON.stringify(S.saved); x[el.dataset.k === 'fav' ? 'fav' : 'list'] = false;
  if (!x.list && !x.fav) S.saved = S.saved.filter(y => y !== x);
  if (!save('saved')) { S.saved = JSON.parse(before); return; }
  keepForm(render);
};
ACTS['sv-log'] = el => {
  const x = S.saved.find(y => y.id === el.dataset.id); if (!x) return;

/* ---------- Barcode: camera scan (where the browser supports it) or typed number -> Open Food Facts ---------- */
let scanStream = null, scanTimer = null;
function stopScan() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
function bcNote(msg, bad) { const n = $('#f-bc-note'); if (n) { n.textContent = msg || ''; n.style.color = bad ? 'var(--bad)' : ''; } }
ACTS['f-scan'] = async () => {
  const box = $('#f-bc');
  if (!('BarcodeDetector' in window) || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { bcNote('Camera scanning is not supported in this browser. Type the number under the barcode.', true); if (box) box.focus(); return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) { scanStream = null; bcNote('Camera blocked or unavailable. Type the number under the barcode instead.', true); if (box) box.focus(); return; }
  openSheet('<h2>Scan a barcode</h2><div class="scanbox"><video id="bc-video" playsinline muted autoplay></video><i class="scanline"></i></div><p class="mu sm c" style="margin:10px 0">Hold the barcode inside the frame.</p><button class="btn ghost blk" data-act="sheet-close">Cancel</button>');
  const v = $('#bc-video'); v.srcObject = scanStream; try { await v.play(); } catch (e) {}
  let det; try { det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); } catch (e) { stopScan(); closeSheet(); bcNote('Scanning is not supported here. Type the number.', true); return; }
  let busy = false;
  scanTimer = setInterval(async () => {
    if (busy || !scanStream) return; busy = true;
    try {
      const codes = await det.detect(v);
      if (codes.length && /^\d{8,14}$/.test(codes[0].rawValue)) { const code = codes[0].rawValue; stopScan(); closeSheet(); const b = $('#f-bc'); if (b) b.value = code; lookupBarcode(code); }
    } catch (e) {}
    busy = false;
  }, 300);
};
ACTS['f-bc-go'] = () => lookupBarcode(($('#f-bc').value || '').replace(/\s+/g, ''));
function lookupBarcode(code) {
  if (!/^\d{8,14}$/.test(code)) { bcNote('Enter the 8 to 14 digit number printed under the barcode.', true); return; }
  if (!isOnline()) { bcNote("You're offline. Connect to look up a barcode, or enter the meal by hand.", true); return; }
  if (!S.settings.offOK) {
    openSheet('<h2>Look up this barcode?</h2><p class="mu" style="margin:8px 0">The barcode number is sent to <b>Open Food Facts</b>, a free public food database, to find the product. Nothing else is sent, and not every product is in it.</p>'
      + '<div class="grid2"><button class="btn ghost" data-act="sheet-close">Cancel</button><button class="btn pri" data-act="bc-allow" data-code="' + code + '">Allow</button></div>');
    return;
  }
  bcNote('Looking up ' + code + '...');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,nutriments,serving_size', { signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' })
    .then(r => r.json()).then(j => {
      const p = j && j.status === 1 && j.product;
      if (!p) { bcNote('Not found. Not every product is in the database - enter it by hand.', true); return; }
      const n = p.nutriments || {}, sv = n['energy-kcal_serving'] != null, sfx = sv ? '_serving' : '_100g';

/* ---------- Progress photos: shrink before saving so ~5 MB of storage goes a long way ---------- */
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a readable image.')); };
    img.src = url;
  });
}
async function addPhoto(file) {
  try {
    let data = await compressImage(file, 720, 0.6);
    if (data.length > 140000) data = await compressImage(file, 560, 0.5);          // keep each photo small
    const list = S.photos[photoDate] || (S.photos[photoDate] = []);
    list.push(data);
    if (!save('photos')) { list.pop(); if (!list.length) delete S.photos[photoDate]; return; }   // save() already showed the storage alert
    toast('Photo saved (' + Math.round(data.length / 1024) + ' KB)');
    render();
  } catch (e) { alert('Could not add that photo: ' + e.message); }
}

ACTS['bk-export'] = async () => {
  const text = exportJSON(), name = APP_ID + '-backup-' + todayStr() + '.json';
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {   // home-screen apps on iOS can't download; use the share sheet
      await navigator.share({ files: [file], title: APP_NAME + ' backup' }); toast('Backup ready - save it to Files'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup downloaded');
};

    let when = '';
    try { const o = JSON.parse(rd.result); if (!o || o.app !== APP_ID) throw 0; when = o.exported ? ' from ' + new Date(o.exported).toLocaleDateString() : ''; }
    catch (x) { alert('That file is not a Pocket Gym backup.'); return; }

      try { importJSON(rd.result); } catch (err) { alert(err.message); return; }

function wheelSet(el, e) {
  const r = el.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const h = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360, s = clamp(Math.hypot(dx, dy) / (r.width / 2) * 100, 10, 100);
  S.settings.accent = { h: Math.round(h), s: Math.round(s) };

}

const prScore = (kind, s) => kind === 'cd' ? s.r : kind === 'bw' ? s.r + (s.w || 0) / 1000 : s.w + s.r / 1000;
const prText = (kind, s) => kind === 'cd' ? s.r + ' min' : kind === 'bw' ? (s.w > 0 ? '+' + fmtNum(s.w) + ' lb × ' : '') + s.r + (s.w > 0 ? '' : ' reps') : fmtNum(s.w) + ' lb × ' + s.r;
function prBoard() {
  const best = {};
  S.workouts.forEach(w => {
    if (w.type !== 'workout') return;
    (w.items || []).forEach(i => (i.sets || []).forEach(s => {
      const sc = prScore(i.kind, s), b = best[i.id];
      if (!b || sc >= b.sc) best[i.id] = { id: i.id, name: i.name, kind: i.kind, s, sc, date: w.date };
    }));
  });
  return Object.values(best).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.name < b.name ? -1 : 1));
}
function exSessions(id) {
  const out = [];
  S.workouts.forEach(w => {
    if (w.type !== 'workout') return;
    const it = (w.items || []).find(x => x.id === id);
    if (it && it.sets && it.sets.length) out.push({ date: w.date, kind: it.kind, v: Math.max.apply(null, it.sets.map(s => it.kind === 'cd' ? s.r : it.kind === 'bw' ? s.r : s.w)) });
  });
  return out.slice(-12);
}
const wkWorkouts = start => S.workouts.filter(w => w.type === 'workout' && w.date >= start && w.date < addDays(start, 7)).length;
function streakWeeks() {
  const goal = S.settings.goal || 4, cur = sundayOf(todayStr());
  let n = wkWorkouts(cur) >= goal ? 1 : 0, w = addDays(cur, -7);
  while (wkWorkouts(w) >= goal && n < 520) { n++; w = addDays(w, -7); }

}

   UI — Run tab: log runs by hand (distance, time, pace - any two fill the third), history, stats

const parseClockStr = str => {
  const s = String(str || '').trim();
  if (!s) return 0;
  if (/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s) * 60);          // plain number = minutes
  const m = s.match(/^(?:(\d+):)?(\d{1,2}):(\d{2})$/);
  return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : 0;
};
const fmtRunTime = sec => { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s); };
const fmtPace = sec => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + pad(sec % 60); };
const runCal = (mi, lbs) => Math.round(0.75 * (lbs || S.profile.lbs) * mi);      // rough: about 0.75 kcal per lb per mile

let runForm = { date: todayStr(), mi: '', time: '', pace: '', order: [] };

function runStats() {
  const runs = S.runs, wk = sundayOf(todayStr());
  const thisWeek = runs.filter(r => r.date >= wk).reduce((a, r) => a + r.mi, 0);
  const longest = runs.reduce((m, r) => Math.max(m, r.mi), 0);
  const best = runs.filter(r => r.mi >= 0.5).reduce((m, r) => Math.min(m, r.sec / r.mi), Infinity);
  const weeks = lastWeeks(8), vals = weeks.map(w => +runs.filter(r => r.date >= w && r.date < addDays(w, 7)).reduce((a, r) => a + r.mi, 0).toFixed(1));
  return { thisWeek, longest, best, weeks, vals, total: runs.reduce((a, r) => a + r.mi, 0) };
}

function vRun() {
  const st = runStats(), f = runForm, stat = (v, l) => '<div class="card flat c" style="padding:12px"><div class="b" style="font-size:1.25rem">' + v + '</div><div class="mu xs">' + l + '</div></div>';
  const list = S.runs.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id > a.id ? 1 : -1)).slice(0, 60);
  return '<div class="page-h"><div><div class="lbl">Cardio</div><h1>Run</h1></div><span class="chip pu">' + ic('run') + ' ' + st.thisWeek.toFixed(1) + ' mi this week</span></div>'
    + '<div class="card"><h2 style="margin-bottom:6px">Log a run</h2><p class="mu sm" style="margin-bottom:12px">Fill in any two of distance, time and pace - the third fills itself.</p><div class="col">'
    + field('Date', '<input class="in" id="run-date" type="date" max="' + todayStr() + '" value="' + f.date + '" data-ch="run-date">')
    + '<div class="grid2">' + field('Distance (miles)', '<input class="in" id="run-mi" type="text" inputmode="decimal" placeholder="3.1" data-in="run-f" data-k="mi" value="' + esc(f.mi) + '">')
    + field('Time (m:ss)', '<input class="in" id="run-time" type="text" inputmode="numeric" placeholder="28:30" data-in="run-f" data-k="time" value="' + esc(f.time) + '">') + '</div>'
    + field('Average pace (per mile)', '<input class="in" id="run-pace" type="text" inputmode="numeric" placeholder="9:10" data-in="run-f" data-k="pace" value="' + esc(f.pace) + '">')
    + '<div class="mu sm" id="run-calc"></div>'
    + '<button class="btn pri big" data-act="run-add">' + ic('plus') + ' Save run</button></div></div>'
    + '<div class="card"><h3 style="margin-bottom:10px">Miles per week</h3>' + barsHTML(st.vals, st.weeks.map(weekLabel), v => String(v)) + '</div>'
    + '<div class="grid3">' + stat(st.longest ? st.longest.toFixed(1) + ' mi' : '-', 'longest run') + stat(isFinite(st.best) ? fmtPace(st.best) : '-', 'best pace /mi') + stat(st.total.toFixed(1), 'total miles') + '</div>'
    + '<div class="card"><h3 style="margin-bottom:6px">History</h3>'
    + (list.length ? list.map(r => '<div class="hrow"><span><b>' + r.mi.toFixed(2).replace(/\.?0+$/, '') + ' mi</b> · ' + fmtRunTime(r.sec) + ' · ' + fmtPace(r.sec / r.mi) + ' /mi<br><span class="mu sm">' + fmtDate(r.date, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ~' + r.cal + ' kcal</span></span>'
      + '<button class="ib bad" data-act="run-del" data-id="' + r.id + '" aria-label="Delete run">' + ic('trash') + '</button></div>').join('') : '<div class="empty">No runs yet. Log your first one above.</div>') + '</div>';
}

/* Two most recently edited fields are the inputs; the other one is calculated */
INP['run-f'] = el => {
  const f = runForm, k = el.dataset.k;
  f[k] = el.value; f.order = f.order.filter(x => x !== k); if (el.value.trim()) f.order.push(k);
  const filled = f.order.filter(x => f[x].trim());
  if (filled.length < 2) { $('#run-calc').textContent = ''; return; }
  const tgt = ['mi', 'time', 'pace'].find(x => filled.slice(-2).indexOf(x) < 0);
  const mi = num(f.mi, 0), sec = parseClockStr(f.time), pace = parseClockStr(f.pace);
  let out = '';
  if (tgt === 'pace' && mi > 0 && sec > 0) out = fmtPace(sec / mi);
  else if (tgt === 'time' && mi > 0 && pace > 0) out = fmtRunTime(mi * pace);
  else if (tgt === 'mi' && sec > 0 && pace > 0) out = (sec / pace).toFixed(2).replace(/\.?0+$/, '');
  if (!out) return;
  f[tgt] = out; const box = $('#run-' + tgt); if (box) box.value = out;
  const m = num(f.mi, 0); $('#run-calc').textContent = m > 0 && S.settings.runcal !== false ? 'About ' + runCal(m) + ' kcal burned' : '';
};
CHG['run-date'] = el => { runForm.date = /^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= todayStr() ? el.value : todayStr(); el.value = runForm.date; };
ACTS['run-add'] = () => {
  const f = runForm;
  let mi = num(f.mi, 0), sec = parseClockStr(f.time);
  const pace = parseClockStr(f.pace);
  if (!(mi > 0) && sec > 0 && pace > 0) mi = sec / pace;
  if (!(sec > 0) && mi > 0 && pace > 0) sec = mi * pace;
  if (!(mi > 0) || !(sec > 0)) { toast('Enter two of distance, time and pace'); return; }
  if (mi > 100 || sec > 86400) { toast('That looks too big - check the numbers'); return; }
  mi = Math.round(mi * 100) / 100; sec = Math.round(sec);
  if (sec / mi < 150) { toast('Faster than a 2:30 mile? Check the time'); return; }
  S.runs.push({ id: uid(), date: f.date || todayStr(), mi, sec, cal: runCal(mi) });
  if (!save('runs')) { S.runs.pop(); return; }
  runForm = { date: todayStr(), mi: '', time: '', pace: '', order: [] };
  render(); toast('Run saved');
};
ACTS['run-del'] = el => ask('Delete this run?', 'This removes it from your history and charts.', 'Delete', () => {
  S.runs = S.runs.filter(r => r.id !== el.dataset.id); save('runs'); render();
}, true);

/* =====================================================================
   BOOT
   ===================================================================== */
function initStorage() {
  const missing = load();
  ['split', 'equip', 'settings'].forEach(k => { if (missing.indexOf(k) > -1) save(k, true); });   // pin first-run defaults
  if (S.settings.mig !== 2) {                       // one-time, from an older version: the old build jumped to tomorrow after a workout; days now follow the calendar
    S.settings.mig = 2; S.split.focus = todayStr(); S.split.seen = todayStr();
    save('settings', true); save('split', true);
  }
  const cut = addDays(todayStr(), -30);
  Object.keys(S.plans).forEach(d => { if (d < cut) delete S.plans[d]; });                          // forget old plan edits
}

function afterReload() {
  initStorage();
  applyInc();
  applyTheme();
  ensureFocus();
  if (S.session) beginTicker(); else { endTicker(); leaveSession(); }
  renderNav();
  render();
  renderNet();
}

/* Re-check the date whenever the app comes back to the foreground (e.g. opened the next morning) */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.session) return;
  const f = S.split.focus;
  ensureFocus();
  if (S.split.focus !== f || tab === 'workout') render();
});

/* Optional offline support: works if a sw.js sits next to this file on a web server */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(() => caches.open('pocketgym-v1').then(c => c.add(location.href.split('#')[0]))).catch(() => {});   // keep a copy so the app can start with no connection
}

initStorage();
if (!S.profile.done) tab = 'settings';          // first run lands on the profile screen
afterReload();

/* Small surface for debugging and tests */
window.PocketGym = { S, analyze, calcTargets, targets, buildAuto, planFor, dayInfo, startSession, finishSession, toggleSet, setField, render, go, exportJSON, importJSON, LIB, cleanAI, buildAIContext, optimizeToday, AI_PROVIDERS, aiKey };
})();
</script>
</body>
</html>
